name: Build Windows release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore application icon
        shell: pwsh
        run: |
          $icon = [Convert]::FromBase64String((Get-Content Assets/YtDownloaderPro.ico.base64 -Raw))
          [IO.File]::WriteAllBytes('Assets/YtDownloaderPro.ico', $icon)

      - name: Build Windows executable
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          dotnet publish Launcher/Launcher.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true "-p:Version=$version" -o dist

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/YtDownloaderPro.exe
            YtDownloaderPro.bat

